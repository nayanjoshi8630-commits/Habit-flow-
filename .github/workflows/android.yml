name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Publish Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Build Web Application
        env:
          VITE_GEMINI_API_KEY: ${{ secrets.VITE_GEMINI_API_KEY }}
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          validate-wrappers: false

      - name: Build Android Debug APK
        run: gradle assembleDebug --stacktrace -p android

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Create / Update GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' || github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
        uses: softprops/action-gh-release@v2
        with:
          files: android/app/build/outputs/apk/debug/app-debug.apk
          name: HabitFlow Android App (${{ github.ref_name }})
          tag_name: ${{ github.ref_type == 'tag' && github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          body: |
            ## 📱 HabitFlow Android APK

            Download and install the latest HabitFlow Android app APK directly on your device.

            ### 🚀 Highlights
            - **Habit Tracking & Streak Analytics**: Daily check-ins, custom frequencies, subtask progress, and visual stats.
            - **Clock Alarms & Schedule Planner**: Interactive clock time picker and customizable audio chime alarms.
            - **Cloud & Offline Mode**: Local persistence with optional Firebase Firestore cloud sync.

            ### 📥 Installation Instructions
            1. Download `app-debug.apk` from the Assets section below.
            2. Open the file on your Android device and confirm installation (*Allow installation from unknown sources* if prompted).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          
